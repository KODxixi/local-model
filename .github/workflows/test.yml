name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r skill/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check skill/scripts skill/tests

      - name: 测试（integration 用例需要本地模型服务，离线自动跳过）
        run: pytest skill/tests -q
