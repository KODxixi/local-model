# DEPRECATED (2026-09-15)
# 此文件已被 skill 层的 registry.yaml 取代。
# registry.yaml 是知识库配置的唯一真相源 (single source of truth)。
#
# MCP server.py 现在优先读取 registry.yaml，此文件仅作向后兼容 fallback。
# 新增/修改知识库请编辑 registry.yaml，不要改这个文件。
#
# 保留此文件是为了：
# 1. 旧版本 MCP 启动时不报错
# 2. 尚未升级的 agent 调用仍能工作
#
# 迁移完成后（预计 2026-10），此文件将被删除。

# 以下为历史配置快照，仅供参考。实际生效的配置以 registry.yaml 为准。
text_backend:
  embedding:
    base_url: http://127.0.0.1:9123
    model: text-embedding-qwen3-embedding-8b
  rerank:
    base_url: http://127.0.0.1:9123
    model: text-reranker-8b

knowledge_bases:
  # 示例条目。真正生效的配置写在 registry.yaml（私有路径写 registry.local.yaml）
  my_docs:
    type: text
    root: ~/Documents/my-kb
    patterns: ["*.md", "*.txt", "*.py", "*.yaml", "*.yml"]  # 不含 *.json：结构化事实不进语义索引（2026-09-19）
    max_files: 3000
    capability:
      good_for: [文档全文检索, 笔记检索]
      not_for: [精确事实权威源, 图片检索]
      example_queries: [哪里讨论过某个方案, 之前的设计决策]
